<style>
  html, body { margin: 0; height: 100%; background: #e0218a; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #ff8cc6; }
</style>

<body>
<iframe src="https://script.google.com/macros/s/AKfycbz-M8hA8DGzJQiX9u-ZjqJzvV9SYc_evma6NAEfyOOUTjvRS-3FMmafawXuG_Id7RvMAg/exec"
        title="Pronos Miss France 2027"
        allow="autoplay; camera; clipboard-write; fullscreen"></iframe>
<script>
/* Mémoire de connexion : l'appli (dans le cadre Google) perd sa mémoire sur iPhone.
   Cette page garde le pseudo reconnu et les codes, et les lui rend à chaque ouverture. */
(function () {
  var CLE = 'pronosMemo';
  var AUTORISEES = ['pronosMF27-id2', 'pronosMF27-code', 'pronosMF27-admin'];
  function lire() { try { return JSON.parse(localStorage.getItem(CLE) || '{}') || {}; } catch (e) { return {}; } }
  function ecrire(m) { try { localStorage.setItem(CLE, JSON.stringify(m)); } catch (e) {} }
  window.addEventListener('message', function (e) {
    var hote = '';
    try { hote = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/\.googleusercontent\.com$/.test(hote)) return;
    var d = e.data;
    if (!d || d.pronos !== 1) return;
    var m = lire();
    if (d.op === 'get') {
      e.source.postMessage({ pronos: 1, op: 'memo', data: m }, e.origin);
    } else if (d.op === 'set' && AUTORISEES.indexOf(d.k) !== -1 && typeof d.v === 'string' && d.v.length < 200) {
      m[d.k] = d.v; ecrire(m);
    } else if (d.op === 'del' && AUTORISEES.indexOf(d.k) !== -1) {
      delete m[d.k]; ecrire(m);
    }
  });
})();
</script>
</body>
</html>
